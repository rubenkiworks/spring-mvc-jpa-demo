<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <h1 th:text="'Detalles del empleado: ' + ${empleado.nombre} + ' ' + ${empleado.primerApellido}"></h1>

    <a th:href="@{/empleados}" class="btn btn-info margin">Volver</a>
    <div class="conainer">
        <div class="row">
            <div class="col">
                <h2>Numeros de telefono</h2>
                <ul th:each="telefono : ${telefonos}" class="list-group">
                    <li th:text="${telefono.numero}" class="list-group-item"></li>
                </ul>
            </div>
            <div class="col">
                <div id="carouselExampleFade" class="carousel slide  carousel-fade"  data-bs-ride="carousel">
                    <div class="carousel-inner" th:each="foto, iter : ${fotosE}">
                      <div th:class="${iter.index == 0}? 'carousel-item active':'carousel-item'">
                        <img th:src="@{/imagenes/}+${foto}" alt="Imagen del empleado" style="width: 100%; height: 450px;">
                      </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
                      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
                      <span class="carousel-control-next-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
